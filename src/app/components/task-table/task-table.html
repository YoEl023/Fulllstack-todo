<table class="tasks-table">
  <thead>
    <tr>
      <th scope="col">S. No.</th>
      <th scope="col" (click)="onSortByName()" class="sortable">
        Task Name @if (sortDirection === 'asc') {
        <span>▲</span>
        } @if (sortDirection === 'desc') {
        <span>▼</span>
        }
      </th>
      @if (isAdmin) {
      <th scope="col">Task User</th>
      }

      <th scope="col">Status</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let task of tasks; let i = index">
      <th>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</th>
      <td>
        @if (editingTaskId !== task.taskID){
        <span> {{ task.taskName }} </span>}

        <input
          *ngIf="editingTaskId === task.taskID"
          type="text"
          class="form-control"
          [(ngModel)]="editTaskName"
          maxlength="100"
        />
      </td>

      <td *ngIf="isAdmin">{{ task.user?.userName }}</td>

      <td>
        <span *ngIf="task.statusID === 1" class="badge bg-info text-dark">To Do</span>
        <span *ngIf="task.statusID === 2" class="badge bg-success">Completed</span>
      </td>

      <td class="text-end text-nowrap" [ngSwitch]="tableType">
        <ng-container *ngSwitchCase="'todo'">
          <ng-container *ngIf="editingTaskId === task.taskID; else viewTodoActions">
            <button class="btn btn-sm btn-success me-2" (click)="saveInlineEdit(task)">Save</button>

            <button class="btn btn-sm btn-secondary" (click)="cancelInlineEdit()">Cancel</button>
          </ng-container>

          <ng-template #viewTodoActions>
            <button class="btn btn-sm btn-success me-2" (click)="complete.emit(task.taskID)">
              Complete
            </button>

            <button class="btn btn-sm btn-primary me-2" (click)="startInlineEdit(task)">
              Edit
            </button>

            <button class="btn btn-sm btn-danger" (click)="delete.emit(task.taskID)">Delete</button>
          </ng-template>
        </ng-container>

        <ng-container *ngSwitchCase="'completed'">
          <button class="btn btn-sm btn-warning me-2" (click)="revert.emit(task.taskID)">
            Revert
          </button>
          <button class="btn btn-sm btn-danger" (click)="delete.emit(task.taskID)">Delete</button>
        </ng-container>

        <ng-container *ngSwitchCase="'deleted'">
          <button class="btn btn-sm btn-info" (click)="restore.emit(task.taskID)">Restore</button>
        </ng-container>
      </td>
    </tr>
  </tbody>
</table>
