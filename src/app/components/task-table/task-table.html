<table class="table table-striped table-hover mt-3 align-middle">
  <thead>
    <tr>
      <th scope="col">#</th>
 <th scope="col" (click)="onSortByName()" class="sortable">
      Task Name
      <span *ngIf="sortDirection === 'asc'">▲</span>
      <span *ngIf="sortDirection === 'desc'">▼</span>
    </th>     
     <th scope="col" *ngIf="isAdmin">Task User</th>
      <th scope="col" *ngIf="tableType !== 'deleted'">Status</th>
      <th scope="col" class="text-end">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let task of tasks; let i = index">
      <th>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</th>
        <td>
      <span *ngIf="editingTaskId !== task.taskID">
        {{ task.taskName }}
      </span>

      <input
        *ngIf="editingTaskId === task.taskID"
        type="text"
        class="form-control"
        [(ngModel)]="editTaskName"
        maxlength="100"
      />
    </td>

      <td *ngIf="isAdmin">{{ task.user?.userName }}</td>
      
      <td *ngIf="tableType !== 'deleted'">
        <span *ngIf="task.statusID === 1" class="badge bg-info text-dark">To Do</span>
        <span *ngIf="task.statusID === 2" class="badge bg-success">Completed</span>
      </td>

      <td class="text-end" [ngSwitch]="tableType">
        
        <ng-container *ngSwitchCase="'todo'">
        <ng-container *ngIf="editingTaskId === task.taskID; else viewTodoActions">
      <button
        class="btn btn-sm btn-success me-2"
        (click)="saveInlineEdit(task)">
        Save
      </button>

      <button
        class="btn btn-sm btn-secondary"
        (click)="cancelInlineEdit()">
        Cancel
      </button>
    </ng-container>

    <ng-template #viewTodoActions>
      <button
        class="btn btn-sm btn-success me-2"
        (click)="complete.emit(task.taskID)">
        Complete
      </button>

      <button
        class="btn btn-sm btn-primary me-2"
        (click)="startInlineEdit(task)">
        Edit
      </button>

      <button
        class="btn btn-sm btn-danger"
        (click)="delete.emit(task.taskID)">
        Delete
      </button>
    </ng-template>

  </ng-container>


        <ng-container *ngSwitchCase="'completed'">
          <button class="btn btn-sm btn-warning me-2" (click)="revert.emit(task.taskID)">Revert</button>
          <button class="btn btn-sm btn-danger" (click)="delete.emit(task.taskID)">Delete</button>
        </ng-container>

        <ng-container *ngSwitchCase="'deleted'">
          <button class="btn btn-sm btn-info" (click)="restore.emit(task.taskID)">Restore</button>
        </ng-container>

      </td>
    </tr>
  </tbody>
</table>
